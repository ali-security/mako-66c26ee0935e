name: Run tests

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Arguments forwarded to pytest to select a subset of tests"
        required: false
        default: ""

env:
  PIP_INDEX_URL: https://:2022-11-15T14:37:53.675556Z@time-machines-pypi.sealsecurity.io/

jobs:
  run-test:
    name: ${{ matrix.python-version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # run this job using this matrix
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        python-version:
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"

        exclude:
          # beaker raises warning on 3.10. only windows seems affected
          # See https://github.com/bbangert/beaker/pull/213
          - os: "windows-latest"
            python-version: "3.10"

      fail-fast: false

    # steps to run in each job. Some are github actions, others run shell commands
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up python
        if: ${{ !(runner.os == 'macOS' && matrix.python-version == '3.7') }}
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}

      # arm64 macOS has no CPython 3.7 (setup-python's x64 build links Intel Homebrew
      # gettext, and building from source needs the removed openssl@1.1 formula);
      # the self-contained python.org x86_64 build runs under Rosetta 2
      - name: Set up python 3.7 on macOS
        if: runner.os == 'macOS' && matrix.python-version == '3.7'
        run: |
          curl -fsSLo "$RUNNER_TEMP/python.pkg" https://www.python.org/ftp/python/3.7.9/python-3.7.9-macosx10.9.pkg
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          mkdir -p "$RUNNER_TEMP/py37bin"
          ln -s /Library/Frameworks/Python.framework/Versions/3.7/bin/python3.7 "$RUNNER_TEMP/py37bin/python"
          echo "/Library/Frameworks/Python.framework/Versions/3.7/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/py37bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox "setuptools<=65.5.1"
          python -m pip list

      - name: Build sdist and wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        run: |
          python -m pip install build==0.9.0 setuptools==59.8.0 wheel==0.38.4
          python setup.py setopt -c egg_info -o tag_build -s ""
          python -m build --sdist --no-isolation
          python -m pip install setuptools==65.5.1
          python -m build --wheel --no-isolation

      - name: Upload distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: Run tests
        run: python -m tox -- ${{ inputs.test-filter }}
